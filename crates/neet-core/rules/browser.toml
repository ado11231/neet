# Browser caches. Reviewed on macOS 26.5.

[[rule]]
id = "chrome-cache"
name = "Chrome cache"
category = "browser"
tier = "caution"
paths = ["~/Library/Caches/Google/Chrome/*"]
description = "Pages & images Chrome saved to load sites faster. Bookmarks & passwords are kept. Sites load slower at first."
regenerates = true
requires_quit = ["com.google.Chrome"]
min_age_days = 0
