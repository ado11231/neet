# Package manager download caches. Clearing one means later installs download
# the packages again. Reviewed on macOS 26.5.

[[rule]]
id = "npm-cache"
name = "npm cache"
category = "package"
tier = "caution"
paths = ["~/.npm/_cacache/*"]
description = "Packages npm downloaded before. Your projects keep their own node_modules. Later installs download the packages again."
regenerates = true
min_age_days = 0

[[rule]]
id = "homebrew-downloads"
name = "Homebrew downloads"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/Homebrew/*"]
description = "Installers & bottles Homebrew downloaded. Installed programs are kept. Later installs & upgrades download them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "pnpm-cache"
name = "pnpm cache"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/pnpm/*"]
description = "Package details pnpm downloaded. The package store is kept. Later installs download the details again."
regenerates = true
min_age_days = 0

[[rule]]
id = "cargo-downloads"
name = "Cargo downloads"
category = "package"
tier = "caution"
paths = ["~/.cargo/registry/cache/*"]
description = "Crate files Cargo downloaded. Builds that need them download them again & offline builds fail until then."
regenerates = true
min_age_days = 0

[[rule]]
id = "node-gyp-headers"
name = "node-gyp headers"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/node-gyp/*"]
description = "Node.js header files used to build native packages. The next native build downloads them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "pip-cache"
name = "pip cache"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/pip/*", "~/.cache/pip/*"]
description = "Packages & wheels pip downloaded or built. Installed packages are kept. Later installs download or build them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "yarn-cache"
name = "Yarn cache"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/Yarn/*"]
description = "Packages Yarn downloaded. Your projects keep their own node_modules. Later installs download the packages again."
regenerates = true
min_age_days = 0
