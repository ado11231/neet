# Package manager download caches. Clearing one means later installs download
# the packages again. Reviewed on macOS 26.5.

[[rule]]
id = "npm-cache"
name = "npm cache"
category = "package"
tier = "caution"
paths = ["~/.npm/_cacache/*"]
description = "Packages npm downloaded. Projects keep their own node_modules. Installs download them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "homebrew-downloads"
name = "Homebrew downloads"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/Homebrew/*"]
description = "Installers Homebrew downloaded. Installed programs are kept. Upgrades download them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "pnpm-cache"
name = "pnpm cache"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/pnpm/*"]
description = "Package info pnpm downloaded. The package store is kept. Installs download it again."
regenerates = true
min_age_days = 0

[[rule]]
id = "cargo-downloads"
name = "Cargo downloads"
category = "package"
tier = "caution"
paths = ["~/.cargo/registry/cache/*"]
description = "Packages Cargo downloaded. Builds download them again. Offline builds fail until then."
regenerates = true
min_age_days = 0

[[rule]]
id = "node-gyp-headers"
name = "Node.js headers"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/node-gyp/*"]
description = "Files used to build native Node.js packages. The next build downloads them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "pip-cache"
name = "pip cache"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/pip/*", "~/.cache/pip/*"]
description = "Packages pip downloaded or built. Installed packages are kept. Installs download them again."
regenerates = true
min_age_days = 0

[[rule]]
id = "yarn-cache"
name = "Yarn cache"
category = "package"
tier = "caution"
paths = ["~/Library/Caches/Yarn/*"]
description = "Packages Yarn downloaded. Projects keep their own node_modules. Installs download them again."
regenerates = true
min_age_days = 0
