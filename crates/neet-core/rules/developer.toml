# Developer tool files. Reviewed on macOS 26.5 with Xcode 26.6.

[[rule]]
id = "xcode-derived-data"
name = "Xcode build files"
category = "developer"
tier = "safe"
paths = ["~/Library/Developer/Xcode/DerivedData/*"]
description = "Build files & indexes. Xcode makes them again on the next build."
regenerates = true
requires_quit = ["com.apple.dt.Xcode"]
min_age_days = 0

[[rule]]
id = "simulator-caches"
name = "Simulator caches"
category = "developer"
tier = "safe"
paths = ["~/Library/Developer/CoreSimulator/Caches/*"]
description = "Caches simulators make while running. Simulators & their apps are kept."
regenerates = true
requires_quit = ["com.apple.iphonesimulator"]
min_age_days = 0

[[rule]]
id = "xcode-device-support"
name = "Xcode device support"
category = "developer"
tier = "caution"
paths = ["~/Library/Developer/Xcode/iOS DeviceSupport/*"]
description = "Files copied from each iPhone or iPad you connected. Xcode copies them again on the next connect, which can take minutes."
regenerates = true
requires_quit = ["com.apple.dt.Xcode"]
min_age_days = 30

[[rule]]
id = "playwright-browsers"
name = "Playwright browsers"
category = "developer"
tier = "caution"
paths = ["~/Library/Caches/ms-playwright/*"]
description = "Browsers downloaded for Playwright tests. Run `npx playwright install` before your next test."
regenerates = false
min_age_days = 0
