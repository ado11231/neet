[package]
name = "neet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The scanner, cleanup rules, safety checks, and Trash moves behind the neet disk cleaner for macOS."
keywords = ["macos", "disk", "cleanup", "cache"]
categories = ["filesystem"]

[dependencies]
jwalk = "0.9.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
toml_edit = "0.25"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
