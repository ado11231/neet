name: CI

# Pull requests run CI once, and master runs it again after each merge.
on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, lint, and test
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  msrv:
    name: Minimum Rust version
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Keep this in step with rust-version in Cargo.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Check with the minimum version
        run: cargo check --workspace --all-targets --all-features --locked

  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check target
        run: cargo check --workspace --all-features --target ${{ matrix.target }}
